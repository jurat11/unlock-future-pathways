<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #FDF8EC;
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .countdown-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .countdown-number {
            font-size: 2rem;
            font-weight: bold;
            color: #B85C3A;
        }
        .countdown-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <h1>Countdown Test</h1>
    <p>Testing countdown to August 3, 2025</p>
    
    <div class="countdown">
        <div class="countdown-item">
            <div class="countdown-number" id="days">00</div>
            <div class="countdown-label">DAYS</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-number" id="hours">00</div>
            <div class="countdown-label">HOURS</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-number" id="minutes">00</div>
            <div class="countdown-label">MINUTES</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-number" id="seconds">00</div>
            <div class="countdown-label">SECONDS</div>
        </div>
    </div>

    <script>
        function updateCountdown() {
            const launchDate = new Date('August 3, 2025 00:00:00').getTime();
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = Math.max(0, days).toString().padStart(2, '0');
            document.getElementById('hours').textContent = Math.max(0, hours).toString().padStart(2, '0');
            document.getElementById('minutes').textContent = Math.max(0, minutes).toString().padStart(2, '0');
            document.getElementById('seconds').textContent = Math.max(0, seconds).toString().padStart(2, '0');

            console.log('Countdown updated:', { days, hours, minutes, seconds });
        }

        // Initialize countdown
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
